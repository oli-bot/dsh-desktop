<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepWork</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f7f5; color: #1f2328;
    -webkit-user-select: none; user-select: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #202020; color: #e6e6e6; }
  }
  .card { text-align: center; max-width: 420px; padding: 32px; }
  .logo { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 10px; }
  .logo span { color: #2f81f7; }
  .state { font-size: 13px; opacity: 0.75; margin-bottom: 14px; min-height: 18px; }
  .detail {
    font-size: 11px; opacity: 0.55; white-space: pre-wrap; word-break: break-all;
    max-height: 180px; overflow: auto; text-align: left; margin: 0;
  }
  .error .state { color: #d1242f; opacity: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Deep<span>Work</span></div>
    <div class="state" id="state">正在启动引擎…</div>
    <pre class="detail" id="detail"></pre>
  </div>
  <script>
    const state = document.getElementById('state')
    const detail = document.getElementById('detail')
    const params = new URLSearchParams(location.search)
    if (params.get('state') === 'error') {
      document.body.classList.add('error')
      state.textContent = params.get('message') || 'DeepWork 启动失败'
      detail.textContent = params.get('detail') || ''
    } else if (params.get('message')) {
      state.textContent = params.get('message')
    }
  </script>
</body>
</html>
