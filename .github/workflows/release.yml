name: release

# Builds macOS and Windows installer packages and attaches them to a GitHub
# Release. Trigger on tags (e.g. `v0.1.1`); push the tag after bumping the
# version everywhere in package.json.
#
# CI runners start clean, so the full build scripts are used (they rebuild
# the pinned DSH runtime via `build:dsh`) rather than the `:quick` variants
# that assume a local staged runtime cache.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build (${{ matrix.os }})
        run: pnpm run ${{ matrix.script }}
        env:
          DEBUG: electron-builder

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true