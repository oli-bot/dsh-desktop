name: release

# Builds macOS and Windows installer packages and attaches them to a GitHub
# Release. Trigger on tags (e.g. `v0.1.1`); push the tag after bumping the
# version everywhere in package.json.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac:quick
          - os: windows-latest
            script: dist:win:quick
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true