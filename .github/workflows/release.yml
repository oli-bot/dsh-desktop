name: release

# Builds the macOS installer package and attaches it to a GitHub Release.
# Trigger on tags (e.g. `v0.1.1`); push the tag after bumping the version
# everywhere in package.json.
#
# Only macOS is built in CI today. The Windows installer is produced by
# cross-building from macOS (`pnpm run dist:win`) or from a Windows machine,
# then uploaded to the same Release (see README "本地构建与发布"). Native
# windows-latest CI builds are blocked by unstable runtime staging of the
# junction-heavy DSH runtime into the app bundle (fs.cpSync crashes with a
# native exit code; robocopy hangs on the junction graph).
#
# CI runners start clean, so the full build script is used (it rebuilds the
# pinned DSH runtime via `build:dsh`) rather than the `:quick` variant that
# assumes a local staged runtime cache.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run dist:mac

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true